name: Markdown Lint
on:
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.markdownlintignore'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: DavidAnson/markdownlint-cli2-action@e1f1f74bf77dc2f7dae44b9d8c3a1c2d8f4418ed  # v19.0.0
        with:
          config: '.markdownlint.json'